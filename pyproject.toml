[project]
name = "iterm-claude-layout"
version = "0.1.0"
description = "Snapshot iTerm2 windows, tabs and splits with the Claude Code session in each pane, and rebuild them after a crash"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["iterm2>=2.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
iterm-claude-layout = "iterm_claude_layout.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iterm_claude_layout"]
